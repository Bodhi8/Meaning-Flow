[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meaningflow"
version = "0.1.0"
description = "Semantic market modeling framework for understanding meaning propagation in AI-mediated systems"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Bodhi8"}
]
keywords = [
    "semantic-seo",
    "nlp",
    "embeddings",
    "knowledge-graph",
    "content-strategy",
    "search",
    "ai-search",
    "semantic-analysis"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "sentence-transformers>=2.2.0",
    "umap-learn>=0.5.3",
    "hdbscan>=0.8.33",
    "networkx>=3.1",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
viz = [
    "matplotlib>=3.7.0",
    "plotly>=5.15.0",
    "seaborn>=0.12.0",
]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.0.270",
]
all = ["meaningflow[viz,dev]"]

[project.urls]
Homepage = "https://github.com/Bodhi8/Meaning-Flow"
Repository = "https://github.com/Bodhi8/Meaning-Flow"
Issues = "https://github.com/Bodhi8/Meaning-Flow/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["meaningflow*"]

[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311"]

[tool.ruff]
line-length = 88
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]
